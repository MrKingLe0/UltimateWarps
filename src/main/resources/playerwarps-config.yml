  wrong-world: "<red>ᴘʟᴀʏᴇʀ ᴡᴀʀᴘs ᴄᴀɴ ᴏɴʟʏ ʙᴇ sᴇᴛ ɪɴ ᴛʜᴇ ᴏᴠᴇʀᴡᴏʀʟᴅ.</red>"
