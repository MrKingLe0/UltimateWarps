  subfeature-disabled: "<red>ᴛʜɪs ꜰᴇᴀᴛᴜʀᴇ ɪs ᴄᴜʀʀᴇɴᴛʟʏ ᴅɪsᴀʙʟᴇᴅ.</red>"
