#  UltimateWarps - Player Warps Configuration (v4.1)

# Master switch. If false, /playerwarps and the per-player limit/create
# permissions all stop working - existing player warps are kept
# but cannot be visited or edited until this is turned back on.
enabled: true

# How many player warps someone can have if they hold none of the
# numbered ultimatewarps.playerwarps.limit.<n> permission nodes.
# Give a player ultimatewarps.playerwarps.limit.5 for a limit of 5, etc.
# The highest numbered node a player holds always wins (they don't stack).
# ultimatewarps.playerwarps.limit.unlimited overrides everything.
default-limit: 1

#  Feature Toggles & Settings
#  Every new Player Warps feature can be toggled independently below.

# 1. Safe Warp Place Detection
# Checks 3 blocks around the warp position: solid block below and a
# minimum of 2 blocks of air (at the warp position and one block up).
# If unsafe, warp creation or teleportation is cancelled with a message.
safe-warp:
  enabled: true
  check-on-create: true
  check-on-teleport: true

# 2. Warps Rating
# Players can rate a warp (1-5 stars) from the GUI after visiting it.
# After teleporting to a warp they haven't rated yet (and don't own),
# they also receive a clickable chat prompt to open the rating GUI.
# The rating is displayed on the first line of the warp lore.
rating:
  enabled: true
  # Shown on the first line of warp lore when the warp has ratings.
  # Placeholders: {stars}, {average}, {count}
  rated-lore-format: "&7ʀᴀᴛɪɴɢ: &e{stars} &f({average}/5) &7({count})"
  # Shown on the first line of warp lore when the warp has no ratings yet.
  unrated-lore: "&7Not rated yet"

# 3. Money Require (Teleport Cost)
# Players with the permission below can enable a money requirement on
# their warp and set a price via the Edit GUI or /playerwarps cost.
# Server staff and the warp owner never pay to use the warp.
# Note: PlaceholderAPI is only needed when this feature is enabled to
# parse the visitor's balance via balance-placeholder.
money-require:
  enabled: true
  permission: "ultimatewarps.playerwarps.money"
  # PlaceholderAPI placeholder used to check the visitor's balance.
  balance-placeholder: "%vault_eco_balance%"
  # Commands executed by console when a visitor pays for a warp.
  # Available placeholders: %warpowner%, %visitor%, %amount%
  give-command: "/eco give %warpowner% %amount%"
  take-command: "/eco take %visitor% %amount%"

# 4. Whitelist & Blacklist
# Warp owners can enable a whitelist (only whitelisted players can visit)
# and manage whitelisted/blacklisted players via GUI or command.
# Blacklist blocks blacklisted players even when whitelist is turned off.
# Server staff and the warp owner cannot be whitelisted/blacklisted and
# always bypass these restrictions.
whitelist:
  enabled: true

blacklist:
  enabled: true

# 5. Favourite Warps
# Adds a Favourite button in the PlayerWarps GUI so players can filter
# and manage their favourite warps list.
favourites:
  enabled: true


#  Teleport Settings
teleport:
  cooldown: 30
  delay: 3
  cancel-on-move: true
  title:
    enabled: true
    # %warp% is replaced with the player warp's display name (or its plain name if no
    # display name is set). %seconds% is replaced with the seconds remaining.
    message: "<b><gradient:#00DCFF:#7900FF>ᴛᴇʟᴇᴘᴏʀᴛɪɴɢ ᴛᴏ <white>%warp%</white></gradient></b>"
    subtitle: "<gradient:#4547FF:#A4B7FE><b>ᴘʟᴇᴀsᴇ ᴡᴀɪᴛ</b><white> %seconds% </white><b>sᴇᴄᴏɴᴅs</b></gradient>"
  bossbar:
    enabled: true
    # Valid colors: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    color: BLUE
    # Valid styles: SOLID, SEGMENTED_6, SEGMENTED_10, SEGMENTED_12, SEGMENTED_20
    style: SOLID
    text: "<b><gradient:#4547FF:#00DCFF>ᴛᴇʟᴇᴘᴏʀᴛɪɴɢ ᴛᴏ %warp%</gradient></b>"
  particle:
    enabled: true
    # Any valid org.bukkit.Particle name. DUST uses the color/size below; every other
    # particle type ignores them.
    type: DUST
    count: 30
    dust:
      # Accepts "#RRGGBB" hex or "R,G,B" (0-255 each).
      color: "#5555FF"
      size: 1.0
  sound:
    enabled: true
    # Any valid org.bukkit.Sound name.
    type: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0

# These run at /playerwarps set time, not at teleport time - they control
# WHERE a player is allowed to create a warp, not where they can visit one.
location-requirements:
  require-own-claim: false
  require-outside-worldguard-region: false
  overworld-only: false
  min-distance-from-spawn: 0
  min-distance-from-other-playerwarps: 0

rank-multipliers:
  default:
    cooldown: 1.0
    delay: 1.0
  vip:
    cooldown: 0.5
    delay: 0.5
  mvp:
    cooldown: 0.0
    delay: 0.0

